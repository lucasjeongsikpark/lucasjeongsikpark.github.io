<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education - Jeongsik Park</title>
  <meta name="description" content="Education of Jeongsik Park.">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../assets/css/section.css">
  <style>
    .education-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .education-item .details {
      flex: 1;
      padding-right: 20px;
    }

    .details b {
      font-weight: bold;
      font-size: 16px;
    }

    .details i {
      font-style: italic;
      font-size: 14px;
      color: #444;
    }

    .details span {
      display: block;
      margin: 3px 0;
      font-size: 14px;
      color: #444;
    }

    .date {
      white-space: nowrap;
      font-size: 14px;
      color: #555;
    }

    #educations ul {
      list-style-type: none;
      padding-left: 0;
    }

    #educations li {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }

    #educations li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Go Home</a></li>
      </ul>
    </nav>
    <h1>Education</h1>
  </header>
  <main>
    <section id="educations">
      <ul>
        <li class="education-item">
          <div class="details">
            <span><b>University of Southern California</b></span>
            <span><i>Master of Science in Computer Science</i> - AI Specialization</span>
          </div>
          <div class="date">May 2026</div>
        </li>

        <li class="education-item">
          <div class="details">
            <span><b>University of Texas at Dallas</b></span>
            <span><i>Bachelor of Science in Computer Science</i> - GPA: 3.94</span>
          </div>
          <div class="date">May 2024</div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
